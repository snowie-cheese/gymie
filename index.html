<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gymie">
<meta name="theme-color" content="#fff0f6" id="themeColor">
<title>Gymie</title>
<link rel="icon" id="favIcon">
<link rel="apple-touch-icon" id="touchIcon">
<style>
/* ===== Pastel pink theme (dark variant follows iPhone dark mode) ===== */
:root{--bg:#fff0f6;--surface:#fff;--soft:#ffdcea;--line:#f3bfd4;--accent:#c2185b;--accent-ink:#fff;--ink:#2a0d1a;--ink2:#6b4456;--tl:#f7c6da;--tl-past:#e59ab9}
@media (prefers-color-scheme:dark){
  :root{--bg:#1f0d16;--surface:#2d1522;--soft:#45203a;--line:#5c2c47;--accent:#ff9cc6;--accent-ink:#3d0a22;--ink:#fff0f6;--ink2:#d9b3c5;--tl:#4d2640;--tl-past:#7a3b5f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97)}
[hidden]{display:none!important}
h1,h2,h3{margin:0} h2{font-size:21px} h3{font-size:18px}
p{margin:6px 0}
.muted{color:var(--ink2)} .small{font-size:14px} .center{text-align:center}
input{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink)}

/* Header */
#hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;border-bottom:1px solid var(--line)}
#hdr>*{max-width:560px;margin-left:auto;margin-right:auto}
.hrow{display:flex;align-items:center;gap:10px;min-height:44px}
#hdr h1{font-size:24px;flex:1}
.home{flex:none;min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;color:var(--accent);padding:0 10px}
.sname{flex:1;font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600;white-space:nowrap}
/* Morning timeline bar */
.tlbar{position:relative;display:flex;gap:2px;height:12px;margin-top:6px}
.tseg{display:block;height:100%;background:var(--tl);border-radius:3px}
.tseg.past{background:var(--tl-past)}
.tseg.on{background:var(--accent)}
.tmark{position:absolute;top:-3px;width:3px;height:18px;margin-left:-1px;background:var(--ink);border-radius:2px}
.tllbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:4px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tllbl b{color:var(--ink)}
.prog{height:6px;border-radius:3px;background:var(--soft);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.hsub{font-size:13px;color:var(--ink2);margin-top:3px}

/* Main */
#view{padding:12px 16px calc(var(--bottom-h,150px) + 20px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;scroll-margin-top:150px}
.emoji{font-size:40px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.week{display:flex;flex-direction:column;gap:8px;font-size:15px}
.stats{display:flex;gap:16px;color:var(--ink2);font-size:14px;flex-wrap:wrap}
.stats b{color:var(--ink)}

/* Home: session picker */
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:68px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left}
.pick b{font-size:18px}
.pick small{display:block;color:var(--ink2);font-size:13px}
.pick.today{border-color:var(--accent)}
.pill{font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.soft{background:var(--soft);color:var(--ink)}

/* Exercise card */
.ex.cur{border:2px solid var(--accent)}
.ex.done{background:var(--soft);border-color:transparent}
.exhead{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:none;border:0;padding:0;text-align:left;min-height:44px}
.exhead:active{transform:none}
.exname{font-size:19px;font-weight:700}
.tick{color:var(--accent);margin-right:6px}
.target{color:var(--ink2);font-size:15px;white-space:nowrap}
.badge{display:inline-block;background:#fff4c2;color:#5a4300;border:1px solid #e6c84a;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;margin-top:4px}
.wrow{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.round{width:56px;height:56px;flex:none;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-size:28px;font-weight:700;line-height:1;padding:0}
.wval{text-align:center}
.wval b{font-size:40px;font-variant-numeric:tabular-nums;line-height:1.1}
.wval small{display:block;color:var(--ink2);font-size:13px}
.set{display:flex;gap:8px;margin-top:8px}
.setmain{flex:1;display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.chk{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--ink2);display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--ink2)}
.setlbl{flex:1;font-weight:600}
.setlbl em{display:table;margin-bottom:2px;font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;letter-spacing:.04em}
.setval{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.set.is-cur .setmain{border:3px solid var(--accent)}
.set.is-done .setmain{background:var(--soft);border-color:transparent}
.set.is-done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.is-done .setval,.set.is-done .setlbl{color:var(--ink2)}
.edit{width:48px;min-height:58px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink2);font-size:18px;padding:0}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.94)}100%{transform:scale(1)}}
details.cue{margin-top:6px}
summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.fig{margin:4px 0 6px;padding:8px;background:var(--bg);border-radius:12px}
.fig svg{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.fig .bd{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:var(--ink)}
.fig .eq{fill:var(--soft);stroke:var(--ink2);stroke-width:1.5}
.fig .eqa{fill:var(--accent)}
.fig .br{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.fig .cb{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:3 2}
.fig .fl{stroke:var(--line);stroke-width:2}
.fig .ar{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fig p{margin:6px 0 0;font-size:13px;color:var(--ink2);text-align:center}
summary::before{content:"▸";margin-right:6px} details[open]>summary::before{content:"▾"}

/* Controls */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:15px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:#c62828;color:#c62828}
.btn.inline{width:auto}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{min-width:92px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}

/* Treadmill & lists */
.tmrow{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;margin-top:8px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.tmrow.is-done{background:var(--soft);border-color:transparent}
.tmrow.is-done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
ul.tips{margin:4px 0 0;padding-left:20px} ul.tips li{margin:4px 0}
.hist{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:64px}
.hist span{color:var(--ink2);font-size:14px;white-space:nowrap;text-align:right}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--ink2);font-weight:600;font-size:13px}

/* InBody */
.ibrow{width:100%;display:flex;gap:12px;align-items:center;text-align:left;min-height:76px}
.thumb{width:56px;height:72px;flex:none;border-radius:8px;background:var(--soft);object-fit:cover;display:grid;place-items:center;font-size:22px}
.ibvals{font-size:14px;color:var(--ink2)} .ibvals b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{font-size:14px;color:var(--ink2)}
.photo{width:100%;border-radius:12px;display:block;background:var(--soft)}
.deltas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.deltas div{background:var(--soft);border-radius:12px;padding:8px 4px;font-size:13px;color:var(--ink2)}
.deltas b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Chart */
.chart{position:relative;margin:8px 0;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink2);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}

/* Bottom bar */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(env(safe-area-inset-bottom) + 2px)}
#bottom>*{max-width:560px;margin-left:auto;margin-right:auto}
#rest{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:var(--soft);margin-bottom:8px;font-variant-numeric:tabular-nums;text-align:left}
#rest i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width 1s linear}
#rest.over{background:#d9f5df;color:#0d4a1c}
#rest small{color:inherit;opacity:.75}
#action{display:flex;width:100%;min-height:66px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-bottom:6px;padding:6px 12px}
#action .a2{font-size:15px;font-weight:600;opacity:.9}
nav{display:flex}
nav button{flex:1;min-height:52px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);gap:2px}
nav button span{font-size:20px}
nav button[aria-current=page]{color:var(--accent);font-weight:700}

/* Sheet & toast */
#sheet{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pe{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.pe .ins{display:flex;gap:6px;align-items:center}
.pe input{width:64px;padding:8px;text-align:center}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<div id="bottom">
  <button id="rest" data-act="skipRest" hidden></button>
  <button id="action" hidden></button>
  <nav id="nav"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" hidden>

<script>
'use strict';
/* =====================================================================
   1. WORKOUT PLAN — edit this object to change your program.
   kind: 'weight' (kg, +/− buttons) | 'bw' (bodyweight reps) | 'time' (seconds, or unit:'min')
   start: starting weight in kg (per hand if perHand) · step: +/− increment in kg
   items: { ex, sets, reps:[min,max] }
   schedule: index = day of week (0 = Sunday … 6 = Saturday), null = rest
   ===================================================================== */
const DEFAULT_PLAN = {
  exercises: {
    rdl:     { name:'Dumbbell RDL', kind:'weight', perHand:true, start:6, step:1, cue:'Push hips back, knees slightly bent.' },
    thrust:  { name:'Hip Thrust', kind:'weight', start:20, step:1, cue:"Squeeze glutes at the top, don't arch your lower back." },
    abd:     { name:'Hip Abduction', kind:'weight', start:15, step:1, cue:'Open slowly, no momentum.' },
    bridge:  { name:'Glute Bridge Hold', kind:'time', cue:'Squeeze glutes at the top, keep ribs down.' },
    lat:     { name:'Lat Pulldown', kind:'weight', start:10, step:1, cue:'Pull to upper chest, elbows down and back.' },
    row:     { name:'Seated Cable Row', kind:'weight', start:10, step:1, cue:'Chest tall, squeeze shoulder blades together.' },
    face:    { name:'Face Pull', kind:'weight', start:5, step:1, cue:'Pull towards your face, elbows high.' },
    sapd:    { name:'Straight Arm Pulldown', kind:'weight', start:5, step:1, cue:'Keep arms straight, move from the shoulders.' },
    deadbug: { name:'Dead Bug', kind:'bw', perSide:true, cue:'Keep lower back pressed into the floor, move slowly.' },
    revcr:   { name:'Reverse Crunch', kind:'bw', cue:'Curl hips up using your abs, no swinging.' },
    frog:    { name:'Frog Pump', kind:'bw', cue:'Soles together, knees out, squeeze glutes at the top.' },
    plank:   { name:'Plank', kind:'time', cue:'Straight line head to heels, squeeze glutes.' },
    heel:    { name:'Heel Taps', kind:'bw', perSide:true, cue:'Shoulders off the floor, reach side to side.' },
    yoga:    { name:'Stretching / Yoga', kind:'time', unit:'min', cue:'Gentle stretches for hips, hamstrings and back.' }
  },
  sessions: {
    glA: { name:'Glute A', sub:'RDL · Hip Thrust · Abduction', treadmill:true, items:[
      { ex:'rdl', sets:3, reps:[10,12] }, { ex:'thrust', sets:3, reps:[10,12] },
      { ex:'abd', sets:3, reps:[15,20] }, { ex:'bridge', sets:2, reps:[20,30] } ] },
    bkA: { name:'Back & Core A', sub:'Pulldown · Row · Face Pull · Core', treadmill:true, items:[
      { ex:'lat', sets:3, reps:[12,12] }, { ex:'row', sets:2, reps:[12,12] }, { ex:'face', sets:2, reps:[15,15] },
      { ex:'deadbug', sets:2, reps:[10,10] }, { ex:'revcr', sets:2, reps:[12,12] } ] },
    glB: { name:'Glute B', sub:'Hip Thrust · RDL · Abduction', treadmill:true, items:[
      { ex:'thrust', sets:3, reps:[12,12] }, { ex:'rdl', sets:2, reps:[12,12] },
      { ex:'abd', sets:3, reps:[15,20] }, { ex:'frog', sets:2, reps:[20,20] } ] },
    bkB: { name:'Back & Core B', sub:'Pulldown · Straight Arm · Face Pull · Core', treadmill:true, items:[
      { ex:'lat', sets:2, reps:[12,12] }, { ex:'sapd', sets:2, reps:[12,12] }, { ex:'face', sets:2, reps:[15,15] },
      { ex:'plank', sets:2, reps:[30,30] }, { ex:'heel', sets:2, reps:[12,12] } ] },
    stretch: { name:'Stretching / Yoga', sub:'Optional, light', optional:true, treadmill:false, items:[
      { ex:'yoga', sets:1, reps:[20,30] } ] }
  },
  schedule: ['stretch', 'glA', 'bkA', null, 'glB', 'bkB', null],
  treadmill: [
    { name:'Warm-up',      min:'5',    setting:'Incline 2 · Speed 4' },
    { name:'Incline walk', min:'5–10', setting:'Incline 6 · Speed 5–5.5' },
    { name:'Cool-down',    min:'5',    setting:'Incline 0 · Speed 4.5' }
  ],
  walkCue: 'Short, even steps. Land softly on the heel, roll through mid-foot to toes. No need to hold the rails.',
  // Session timeline: [phase, minutes]. Starts when you tap "Start workout" (total 1 h 15 min).
  timeline: [ ['Warm-up', 7], ['Weights', 35], ['Treadmill', 20], ['Stretch & rest', 5], ['Wrap up', 8] ],
  tips: [
    "Don't train to failure — keep 2–3 reps in reserve.",
    'Increase weight only after completing all reps with good form.'
  ],
  weeks: [
    'Get used to the schedule, pick comfortable weights.',
    'Keep weights, watch fatigue and recovery.',
    'Increase weight slightly if strong enough and form is good.',
    'Assess strength, glute measurements, thigh feel, energy.'
  ]
};
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* InBody fields you can log (all optional) */
const IB_FIELDS = [
  ['weight', 'Weight', 'kg'], ['smm', 'Skeletal muscle', 'kg'], ['bfm', 'Body fat mass', 'kg'],
  ['pbf', 'Body fat', '%'], ['bmi', 'BMI', ''], ['vfl', 'Visceral fat lvl', ''], ['score', 'InBody score', '']
];

/* Exercise hint drawings (side view unless noted). Each frame: h = head [x,y], b = body lines,
   e = equipment behind the body, f = equipment in front. Frame size 120×100, floor at y=92. */
const EQ = {
  db:    (x, y) => `<rect class="eqa" x="${x - 8}" y="${y - 3}" width="16" height="6" rx="3"/>`,
  plate: (x, y) => `<circle class="eqa" cx="${x}" cy="${y}" r="8"/>`,
  box:   (x, y, w, h) => `<rect class="eq" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`,
  bar:   (x1, x2, y) => `<line class="br" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`,
  cable: (x1, y1, x2, y2) => `<line class="cb" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`
};
const LYING = { h:[12,82], arm:[24,88,44,90] };
const FIGS = {
  rdl: { cap:'Push hips back, slight knee bend, flat back', frames:[
    { h:[60,14], b:[[60,24,60,56],[60,26,64,42,67,57],[60,56,61,74,60,91,68,91]], f:[['db',67,60]] },
    { h:[82,32], b:[[44,54,74,40],[74,42,74,58,74,72],[44,54,52,73,52,91,60,91]], f:[['db',74,74]] } ] },
  thrust: { cap:'Upper back on bench, drive hips up, chin tucked', frames:[
    { h:[20,44], e:[['box',4,54,30,38]], b:[[28,52,50,78],[30,54,40,66,50,72],[50,78,74,60,80,91,88,91]], f:[['plate',50,72]] },
    { h:[20,44], e:[['box',4,54,30,38]], b:[[28,52,58,50],[30,54,44,52,56,46],[58,50,80,52,82,91,90,91]], f:[['plate',58,44]] } ] },
  abd: { cap:'Front view: sit tall, push knees out slowly, control back in', frames:[
    { h:[60,14], e:[['box',38,52,44,8],['box',42,64,6,14],['box',72,64,6,14]],
      b:[[60,22,60,54],[48,28,72,28],[48,28,46,44,46,56],[72,28,74,44,74,56],[54,56,54,74,54,91],[66,56,66,74,66,91]] },
    { h:[60,14], e:[['box',38,52,44,8],['box',30,62,6,14],['box',84,62,6,14]],

/* ===== 2. STORAGE ===== */
// Workout data → localStorage (saved on every tap). InBody photos → IndexedDB (too big for localStorage).
// Nothing is ever uploaded: everything stays in this browser on this phone.
const KEY = 'gymlog';
const DEFAULT_STATE = () => ({
  version: 2,
  weights: {},          // exerciseId -> last used weight (kg)
  history: [],          // finished sessions, newest first
  current: null,        // in-progress session (resumed if reopened the same day)
  inbody: [],           // InBody results, newest first
  plan: null,           // custom plan (null = DEFAULT_PLAN)
  settings: { rest:90, startDate:null }
});
function migrate(d) {
  const base = DEFAULT_STATE();
  if (!d || typeof d !== 'object') return base;
  if ((d.version || 1) < 2) { delete d.assessments; d.plan = null; }   // v1 → v2: new 1 kg steps, plain-English plan
  return { ...base, ...d, settings: { rest: d.settings?.rest ?? 90, startDate: d.settings?.startDate ?? null }, version: 2 };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return DEFAULT_STATE();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Could not save'); } }
let S = load();

const IDB = {   // tiny IndexedDB wrapper for photos (stored as JPEG data URLs)
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('gymie', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', mode), req = fn(tx.objectStore('photos'));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
    });
  },
  put(k, v) { return this.run('readwrite', s => s.put(v, k)); },
  get(k) { return this.run('readonly', s => s.get(k)); },
  del(k) { return this.run('readwrite', s => s.delete(k)); },
  clear() { return this.run('readwrite', s => s.clear()); }
};
const photoCache = {};

/* In-memory UI state */

const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const num = n => String(Math.round(n * 100) / 100);
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const fmtDate = k => parseKey(k).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
const fmtShort = k => parseKey(k).toLocaleDateString('en-GB', { day:'numeric', month:'numeric' });
const mmss = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fmtW = (w, x) => x.perHand ? `2 × ${num(w)} kg` : `${num(w)} kg`;

const isTraining = sid => { const s = P().sessions[sid]; return !!s && !s.optional; };

const todaySid = () => { const sid = P().schedule[new Date().getDay()]; return sid && P().sessions[sid] ? sid : null; };
const unitTxt = x => x.kind === 'time' ? (x.unit === 'min' ? ' min' : ' s') : '';
function repsLabel(x) {
  const r = x.reps[0] === x.reps[1] ? x.reps[0] : `${x.reps[0]}–${x.reps[1]}`;
  return r + unitTxt(x) + (x.perSide ? ' each side' : '');
}
function setVal(x, s) {
  if (x.kind === 'weight') return `${fmtW(s.w, x)} × ${s.r}`;

}
const elapsed = c => '⏱ ' + (c && c.start ? mmss(Math.max(0, Math.floor((Date.now() - c.start) / 1000))) : '0:00');
const dur = h => h.start && h.end ? Math.max(1, Math.round((h.end - h.start) / 60000)) + ' min' : '';
function currentPos(c) {
  for (let i = 0; i < c.ex.length; i++) { const j = c.ex[i].sets.findIndex(s => !s.done); if (j >= 0) return { i, s: j }; }
  return null;
}
function programWeek() {
  if (!S.settings.startDate) return null;
  return Math.floor(Math.round((parseKey(dkey()) - parseKey(S.settings.startDate)) / 864e5) / 7) + 1;
}
function thisWeekCount() {
  const m = dkey(mondayOf(new Date()));
  return S.history.filter(h => isTraining(h.sid) && dkey(mondayOf(parseKey(h.date))) >= m).length;
}
/* Streak in DAYS: every day you worked out counts +1. Planned rest days don't break it;

function calcStreak() {
  const days = new Set(S.history.map(h => h.date));
  if (S.current && doneCount(S.current)) days.add(S.current.date);
  if (!days.size) return 0;
  const earliest = [...days].sort()[0], d = new Date(); let n = 0;
  for (let k = 0; k < 1000; k++) {
    const key = dkey(d), sid = P().schedule[d.getDay()];
    if (days.has(key)) n++;

    if (key <= earliest) break;
    d.setDate(d.getDate() - 1);
  }

}
function lastPerf(exId) {
  for (const h of S.history) { const e = h.ex.find(e => e.ex === exId && e.sets.some(s => s.done)); if (e) return e; }
  return null;
}
function readyToIncrease(x) {   // last time: every set done at the top of the rep range, and you haven't gone up yet
  const e = lastPerf(x.ex); if (!e) return false;
  if (!e.sets.every(s => s.done && s.r >= e.reps[1])) return false;
  const curW = (x.sets.find(s => !s.done) || x.sets[x.sets.length - 1]).w;
  return Math.min(...e.sets.map(s => s.w ?? 0)) >= curW;
}
function newSession(sid) {
  const p = P(), ses = p.sessions[sid];
  return {
    id: Date.now().toString(36), date: dkey(), sid, name: ses.name, start: null, end: null, lastTs: null,
    tm: ses.treadmill ? p.treadmill.map(() => false) : [],
    ex: ses.items.map(it => {
      const e = p.exercises[it.ex] || { name: it.ex, kind: 'bw' };
      const w = e.kind === 'weight' ? (S.weights[it.ex] ?? e.start ?? 0) : null;
      return { ex: it.ex, name: e.name, kind: e.kind, perHand: !!e.perHand, perSide: !!e.perSide, unit: e.unit || null,

    })

}

  const c = S.current; if (!c) return;
  if (doneCount(c) > 0 || c.tm.some(Boolean)) { c.end = c.end || c.lastTs || Date.now(); c.start = c.start || c.end; S.history.unshift(c); }

}

function defaultView() {

}

/* Session timeline bar (header): starts when you tap "Start workout", planned end = start + 1 h 15 min */
function timelineHTML(c) {

  const ids = Object.entries(P().exercises).filter(([, e]) => e.kind === 'weight').map(([id]) => id);
  if (!ui.progEx || !ids.includes(ui.progEx)) ui.progEx = ids.find(id => series(id).length) || ids[0];
  let h = `<div class="chips">${ids.map(id => `<button class="chip${id === ui.progEx ? ' on' : ''}" data-act="progEx" data-ex="${id}">${esc(P().exercises[id].name)}</button>`).join('')}</div>`;
  const pts = series(ui.progEx), ex = P().exercises[ui.progEx];
  h += `<section class="card"><h3>${esc(ex.name)} — top weight (kg${ex.perHand ? ', per hand' : ''})</h3>`;
  if (!pts.length) return h + `<p class="muted">No data yet — finish a session with this exercise first.</p></section>`;
  const diff = pts[pts.length - 1].v - pts[0].v;
  h += `<p class="muted small">Change since first log: <b style="color:var(--ink)">${diff >= 0 ? '+' : ''}${num(diff)} kg</b></p>` + chartSVG(pts, 'kg');
  h += `<table><thead><tr><th>Date</th><th>Top weight</th><th>Total reps</th></tr></thead><tbody>` +
    pts.slice().reverse().slice(0, 12).map(p => `<tr><td>${fmtDate(p.d)}</td><td>${num(p.v)} kg</td><td>${p.r}</td></tr>`).join('') + `</tbody></table>`;
  return h + '</section>';
}
function chartSVG(pts, unit) {   // single-series line chart; tap/drag to read values
  const W = 340, H = 170, Lp = 36, R = 14, T = 14, B = 24;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const pv = (hi - lo) * 0.12; lo = Math.max(0, lo - pv); hi += pv;
  const x = i => pts.length === 1 ? (Lp + W - R) / 2 : Lp + i * (W - Lp - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  [0, 0.5, 1].forEach(f => { const v = lo + (hi - lo) * f, yy = y(v).toFixed(1);
    g += `<line class="grid" x1="${Lp}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${Lp - 6}" y="${+yy + 4}" text-anchor="end">${num(Math.round(v * 10) / 10)}</text>`; });
  g += `<text class="ax" x="${x(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtShort(pts[0].d)}</text>`;
  if (pts.length > 1) g += `<text class="ax" x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length - 1].d)}</text>`;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const dots = pts.map((p, i) => `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="5"/>`).join('');
  const data = esc(JSON.stringify(pts.map((p, i) => [+x(i).toFixed(1), p.d, p.v])));
  return `<div class="chart" data-pts="${data}" data-unit="${esc(unit)}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress over time">${g}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/><path class="ln" d="${d}"/>${dots}</svg><div class="tip" hidden></div></div>`;
}
function chartPointer(e) {
  const ch = e.target.closest && e.target.closest('.chart'); if (!ch) return;
  const r = ch.querySelector('svg').getBoundingClientRect(), sx = (e.clientX - r.left) * 340 / r.width;
  const b = JSON.parse(ch.dataset.pts).reduce((a, p) => Math.abs(p[0] - sx) < Math.abs(a[0] - sx) ? p : a);
  const xh = ch.querySelector('.xh'); xh.setAttribute('x1', b[0]); xh.setAttribute('x2', b[0]); xh.style.display = '';
  const tip = ch.querySelector('.tip'); tip.hidden = false; tip.textContent = `${fmtDate(b[1])} · ${num(b[2])} ${ch.dataset.unit}`;
  tip.style.left = Math.min(Math.max(b[0] * r.width / 340, 70), r.width - 70) + 'px';
}

async function fillPhotos() {   // load thumbnails/photos from IndexedDB after render
  for (const img of document.querySelectorAll('img[data-photo]')) {
    const id = img.dataset.photo;
    try { if (!(id in photoCache)) photoCache[id] = await IDB.get(id); if (photoCache[id]) img.src = photoCache[id]; } catch (e) {}

}
function compressImage(file) {   // shrink to max 1600px JPEG so text stays readable but storage stays small
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

function renderAction() {   // big thumb button: always does the next thing
  const b = $('#action'), c = S.current;
  if (ui.tab !== 'workout' || ui.view !== 'session' || !c) { b.hidden = true; return; }
  b.hidden = false;
  if (!c.start) {
    b.dataset.act = 'startWorkout';

/* ===== 11. REST TIMER & WAKE LOCK ===== */
function startRest() { ui.rest = { end: Date.now() + S.settings.rest * 1000, total: S.settings.rest }; ui.restOver = 0; }
function tickRest() {
  const el = $('#rest'), show = ui.tab === 'workout' && ui.view === 'session';
  if (ui.rest) {
    const left = Math.ceil((ui.rest.end - Date.now()) / 1000);
    if (left > 0) {
      el.hidden = !show; el.className = '';
      el.innerHTML = `<span>⏱ Rest <b>${mmss(left)}</b></span><small>tap to skip</small><i style="width:${100 * left / ui.rest.total}%"></i>`;
      return updateBottomPad();
    }
    ui.rest = null; ui.restOver = Date.now();
  }
  if (show && ui.restOver && Date.now() - ui.restOver < 5000) { el.hidden = false; el.className = 'over'; el.innerHTML = `<span>✅ Rest over — next set!</span>`; }
  else { el.hidden = true; if (Date.now() - ui.restOver >= 5000) ui.restOver = 0; }
  updateBottomPad();
}
let wakeLock = null;
async function wake() {   // keep the screen on during a session (if supported)
  if (!('wakeLock' in navigator) || wakeLock || document.hidden || !S.current) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {}
}

function csv(rows) { return '﻿' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(',')).join('\r\n'); }
function shareFile(name, text) {
  const blob = new Blob([text], { type:'text/csv' });
  const file = typeof File === 'function' ? new File([blob], name, { type:'text/csv' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
    navigator.share({ files:[file], title:name }).catch(() => {});   // iPhone: Save to Files, open in Numbers, AirDrop…
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('File ready');
  }
}

/* ===== 13. ACTIONS ===== */
const ACT = {
  tab(d) { ui.tab = d.v; if (d.v === 'workout' && !ui.view) ui.view = null; ui.sheet = null; drawSheet(); window.scrollTo(0, 0); render(); },
  startWorkout() { const c = S.current; if (!c) return; c.start = c.start || Date.now(); c.lastTs = Date.now(); save(); render(); },
  goHome() { ui.view = 'home'; window.scrollTo(0, 0); render(); },
  resume() { ui.view = 'session'; window.scrollTo(0, 0); render(); },
  pickSession(d) {
    const c = S.current;
    if (c && c.sid === d.sid) return ACT.resume();
    if (c && (doneCount(c) || c.tm.some(Boolean))) {
      if (!confirm(`Start ${P().sessions[d.sid].name}? Your progress in ${nm(c.name)} will be saved to history.`)) return;
      archiveCurrent();
    }
    S.current = newSession(d.sid); ui.expanded.clear(); ui.rest = null; ui.view = 'session';
    save(); window.scrollTo(0, 0); render();
  },
  toggleSet(d) {
    const c = S.current, i = +d.i, j = +d.s, x = c.ex[i], s = x.sets[j];
    s.done = !s.done; c.lastTs = Date.now(); ui.pop = `s${i}-${j}`;
    if (s.done) {
      c.start = c.start || Date.now();
      if (x.kind === 'weight') S.weights[x.ex] = s.w;           // remember weight for next time
      if (currentPos(c)) startRest(); else ui.rest = null;
      if (x.sets.every(z => z.done)) {                           // exercise finished → jump to the next one
        ui.expanded.delete(i);
        const nxt = currentPos(c);
        ui.scrollTo = nxt ? `ex${nxt.i}` : (c.tm.length ? 'tm' : 'fin'); ui.pop = null;
      }
    }
    save(); render();
  },
  toggleEx(d) { const i = +d.i; ui.expanded.has(i) ? ui.expanded.delete(i) : ui.expanded.add(i); render(); },
  wstep(d) {
    const x = S.current.ex[+d.i], open = x.sets.filter(s => !s.done);
    const base = (open[0] || x.sets[x.sets.length - 1]).w;
    const nw = Math.max(0, Math.round((base + (+d.d) * (x.step || 1)) * 100) / 100);
    (open.length ? open.filter(s => !s.custom) : x.sets).forEach(s => { s.w = nw; });
    if (open[0] && open[0].custom) open[0].w = nw;
    S.weights[x.ex] = nw; save(); render();
  },
  editSet(d) { ui.edit = { i: +d.i, s: +d.s }; openSheet('edit'); },
  ew(d) {
    const x = S.current.ex[ui.edit.i], st = x.sets[ui.edit.s];
    st.w = Math.max(0, Math.round((st.w + (+d.d) * (x.step || 1)) * 100) / 100); st.custom = true;
    S.weights[x.ex] = st.w; save(); render(); drawSheet();
  },
  er(d) {
    const x = S.current.ex[ui.edit.i], st = x.sets[ui.edit.s];
    st.r = Math.max(0, st.r + (+d.d) * (x.kind === 'time' && x.unit !== 'min' ? 5 : 1)); st.custom = true; save(); render(); drawSheet();
  },
  tm(d) { const c = S.current; c.tm[+d.k] = !c.tm[+d.k]; c.lastTs = Date.now(); c.start = c.start || Date.now();
    if (c.tm.every(Boolean)) ui.scrollTo = 'fin'; save(); render(); },
  finish() {
    const c = S.current; if (!c) return;
    if (!doneCount(c) && !c.tm.some(Boolean)) { if (!confirm('Nothing logged yet — discard this session?')) return; S.current = null; }
    else { c.end = Date.now(); archiveCurrent(); toast('Session saved ✓'); }
    ui.rest = null; ui.restOver = 0; ui.expanded.clear(); ui.view = 'home'; releaseWake(); save(); window.scrollTo(0, 0); render();
  },
  closeSheet() { ui.sheet = null; drawSheet(); },
  skipRest() { ui.rest = null; ui.restOver = 0; tickRest(); },
  startProgram() { S.settings.startDate = dkey(); save(); render(); },
  clearStart() { S.settings.startDate = null; save(); render(); },
  hseg(d) { ui.hseg = d.v; render(); },
  progEx(d) { ui.progEx = d.ex; render(); },
  histOpen(d) { ui.histId = d.id; openSheet('hist'); },
  histDel() { if (!confirm('Delete this session from history?')) return; S.history = S.history.filter(h => h.id !== ui.histId); ui.sheet = null; drawSheet(); save(); render(); },
  restStep(d) { S.settings.rest = Math.min(600, Math.max(15, S.settings.rest + (+d.d) * 15)); save(); render(); },
  planOpen() { openSheet('plan'); },
  planReset() { if (!confirm('Restore the default plan?')) return; S.plan = null; save(); toast('Plan restored ✓'); drawSheet(); },
  exportWorkouts() {
    if (!S.history.length) return toast('No finished sessions yet');
    const rows = [['Date', 'Session', 'Exercise', 'Set', 'Weight (kg)', 'Per hand', 'Reps / seconds', 'Done', 'Session minutes']];
    S.history.slice().reverse().forEach(h => {
      const m = h.start && h.end ? Math.round((h.end - h.start) / 60000) : '';
      h.ex.forEach(x => x.sets.forEach((s, j) => rows.push([h.date, nm(h.name), nm(x.name), j + 1, s.w ?? '', x.perHand ? 'yes' : '', s.r, s.done ? 'yes' : 'no', m])));
      if (h.tm && h.tm.length) rows.push([h.date, nm(h.name), 'Treadmill', '', '', '', `${h.tm.filter(Boolean).length}/${h.tm.length} phases`, h.tm.every(Boolean) ? 'yes' : 'no', m]);
    });
    shareFile(`gymie-workouts-${dkey()}.csv`, csv(rows));
  },
  exportInbody() {
    if (!S.inbody.length) return toast('No InBody results yet');
    const rows = [['Date', ...IB_FIELDS.map(([, l, u]) => u ? `${l} (${u})` : l)]];
    S.inbody.slice().reverse().forEach(r => rows.push([r.date, ...IB_FIELDS.map(([k]) => r[k] ?? '')]));
    shareFile(`gymie-inbody-${dkey()}.csv`, csv(rows));
  },
  ibPhoto() { $('#photoIn').click(); },
  ibManual() { ui.ib = { date: dkey(), photo: null }; openSheet('ibForm'); },
  ibMetric(d) { ui.ibMetric = d.v; render(); },
  async ibSave() {
    const d = ui.ib, id = 'ib' + Date.now().toString(36);
    const rec = { id, date: d.date || dkey(), photo: !!d.photo };
    IB_FIELDS.forEach(([k]) => { const v = parseFloat(String(d[k] ?? '').replace(',', '.')); if (!isNaN(v)) rec[k] = v; });
    if (!rec.photo && IB_FIELDS.every(([k]) => rec[k] == null)) return toast('Add a photo or at least one number');
    if (d.photo) { try { await IDB.put(id, d.photo); photoCache[id] = d.photo; } catch (e) { return toast('⚠️ Could not save the photo'); } }
    S.inbody.push(rec); S.inbody.sort((a, b) => b.date.localeCompare(a.date));
    ui.ib = null; ui.sheet = null; drawSheet(); save(); toast('InBody result saved ✓'); render();
  },
  ibOpen(d) { ui.ibId = d.id; openSheet('ibView'); },
  async ibDel() {
    if (!confirm('Delete this InBody result and its photo?')) return;
    S.inbody = S.inbody.filter(r => r.id !== ui.ibId); try { await IDB.del(ui.ibId); } catch (e) {}
    ui.sheet = null; drawSheet(); save(); render();
  },
  async resetAll() {
    if (!confirm('Delete ALL workouts, weights, InBody results and settings? This cannot be undone.')) return;
    releaseWake(); S = DEFAULT_STATE(); save(); try { await IDB.clear(); } catch (e) {}
    ui.tab = 'workout'; ui.view = null; toast('All data cleared'); render();
  }
};

/* ===== 14. EVENTS ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el.dataset, el); wake();
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  if (k.startsWith('ib-') && ui.ib) ui.ib[k.slice(3)] = e.target.value;
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'photoIn') {
    const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    try { ui.ib = { date: dkey(), photo: await compressImage(f) }; openSheet('ibForm'); } catch (err) { toast('Could not read that photo'); }
    return;
  }
  if (el.dataset.change === 'startDate') { S.settings.startDate = el.value || null; save(); render(); }
  if (el.dataset.change === 'plan') {
    const v = Number(el.value); if (el.value === '' || !(v >= 0)) return toast('Enter a number');
    if (!S.plan) S.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
    const path = el.dataset.path.split('.'); let o = S.plan;
    path.slice(0, -1).forEach(k => { o = o[k]; }); o[path[path.length - 1]] = v;
    save(); toast('Plan updated ✓');
  }
});
document.addEventListener('toggle', e => {   // remember open cues/tips across re-renders
  const k = e.target.dataset && e.target.dataset.cue; if (k === undefined) return;
  const key = isNaN(+k) ? k : +k; e.target.open ? ui.cues.add(key) : ui.cues.delete(key);
}, true);
document.addEventListener('pointerdown', chartPointer);
document.addEventListener('pointermove', chartPointer);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); wake(); } });
window.addEventListener('resize', updateBottomPad);

/* ===== 15. APP ICON (drawn at runtime so the file stays single & offline) ===== */
function makeIcon() {
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 180; const g = cv.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 180, 180); gr.addColorStop(0, '#ffc2db'); gr.addColorStop(1, '#e2558f');
    g.fillStyle = gr; g.fillRect(0, 0, 180, 180); g.fillStyle = '#fff';
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.fill(); };
    rr(40, 84, 100, 12, 6); rr(30, 58, 18, 64, 7); rr(132, 58, 18, 64, 7); rr(16, 70, 14, 40, 6); rr(150, 70, 14, 40, 6);
    const url = cv.toDataURL('image/png'); $('#touchIcon').href = url; $('#favIcon').href = url;
  } catch (e) {}
}

/* ===== START ===== */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // ask Safari to keep data
$('#themeColor').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
render();
makeIcon();
setInterval(() => {
  const c = $('#clock'); if (c && S.current) c.textContent = elapsed(S.current);
  const tl = $('#tl'); if (tl) tl.innerHTML = timelineHTML(S.current);
  tickRest();
}, 1000);
</script>
