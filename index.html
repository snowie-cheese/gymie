<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#eaf3ff" id="themeColor">
<title>Gym Log</title>
<link rel="icon" id="favIcon">
<link rel="apple-touch-icon" id="touchIcon">
<style>
/* ===== Themes: pastel blue / pastel pink, each with a dark variant (follows iPhone dark mode) ===== */
body, body[data-theme=blue]{--bg:#eaf3ff;--surface:#fff;--soft:#d6e8ff;--line:#b9d3f5;--accent:#1d5fd1;--accent-ink:#fff;--ink:#0d1b2e;--ink2:#44556b}
body[data-theme=pink]{--bg:#fff0f6;--surface:#fff;--soft:#ffdcea;--line:#f3bfd4;--accent:#c2185b;--accent-ink:#fff;--ink:#2a0d1a;--ink2:#6b4456}
@media (prefers-color-scheme:dark){
  body, body[data-theme=blue]{--bg:#0c1524;--surface:#16233a;--soft:#1f3354;--line:#2c4670;--accent:#8ec5ff;--accent-ink:#06213f;--ink:#eef4ff;--ink2:#a9b9d0}
  body[data-theme=pink]{--bg:#1f0d16;--surface:#2d1522;--soft:#45203a;--line:#5c2c47;--accent:#ff9cc6;--accent-ink:#3d0a22;--ink:#fff0f6;--ink2:#d9b3c5}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97)}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
h2{font-size:21px} h3{font-size:18px}
p{margin:6px 0}
.muted{color:var(--ink2)} .small{font-size:14px}
input,textarea{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink)}
textarea{min-height:72px;resize:vertical}

/* Header */
#hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;max-width:560px;margin:0 auto}
#hdr h1{font-size:24px}
.ses{background:none;border:0;padding:0;font-size:22px;font-weight:800;text-align:left;min-height:44px}
.ses span{color:var(--accent);font-size:16px}
.clock{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600;white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--soft);margin:6px auto 0;overflow:hidden;max-width:560px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.hsub{font-size:13px;color:var(--ink2);margin:4px auto 0;max-width:560px}

/* Main */
#view{padding:12px 16px calc(var(--bottom-h,150px) + 20px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;scroll-margin-top:96px}
.center{text-align:center}
.emoji{font-size:44px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}

/* Week card */
.week{display:flex;flex-direction:column;gap:8px;font-size:15px}
.stats{display:flex;gap:16px;color:var(--ink2);font-size:14px}
.stats b{color:var(--ink)}

/* Exercise card */
.ex.cur{border:2px solid var(--accent)}
.ex.done{background:var(--soft);border-color:transparent}
.exhead{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:none;border:0;padding:0;text-align:left;min-height:44px}
.exhead:active{transform:none}
.exname{font-size:19px;font-weight:700}
.tick{color:var(--accent);margin-right:6px}
.target{color:var(--ink2);font-size:15px;white-space:nowrap}
.badge{display:inline-block;background:#fff4c2;color:#5a4300;border:1px solid #e6c84a;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;margin-top:4px}
.wrow{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.round{width:56px;height:56px;flex:none;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-size:28px;font-weight:700;line-height:1;padding:0}
.wval{text-align:center}
.wval b{font-size:40px;font-variant-numeric:tabular-nums;line-height:1.1}
.wval small{display:block;color:var(--ink2);font-size:13px}
.set{display:flex;gap:8px;margin-top:8px}
.setmain{flex:1;display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.chk{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--ink2);display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--ink2)}
.setlbl{flex:1;font-weight:600}
.setlbl em{display:table;margin-bottom:2px;font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;margin-right:6px;letter-spacing:.04em}
.setval{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.set.is-cur .setmain{border:3px solid var(--accent)}
.set.is-done .setmain{background:var(--soft);border-color:transparent}
.set.is-done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.is-done .setval,.set.is-done .setlbl{color:var(--ink2)}
.edit{width:48px;min-height:58px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink2);font-size:18px;padding:0}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.94)}100%{transform:scale(1)}}
details.cue{margin-top:10px}
summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";margin-right:6px} details[open]>summary::before{content:"▾"}
.exfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.notepre{font-size:14px;color:var(--ink2);margin-top:6px;white-space:pre-wrap}

/* Chips, buttons, segmented */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:15px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:#c62828;color:#c62828}
.btn.inline{width:auto}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.row+.row{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{min-width:92px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}

/* Treadmill & lists */
.tmrow{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;margin-top:8px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.tmrow.is-done{background:var(--soft);border-color:transparent}
.tmrow.is-done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
ul.tips{margin:4px 0 0;padding-left:20px} ul.tips li{margin:4px 0}
.tl{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;font-size:15px}
.tl.now{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hist{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:64px}
.hist span{color:var(--ink2);font-size:14px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--ink2);font-weight:600;font-size:13px}

/* Chart */
.chart{position:relative;margin:8px 0;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink2);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}

/* Bottom bar: rest banner, main thumb action, tabs */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(env(safe-area-inset-bottom) + 2px)}
#bottom>*{max-width:560px;margin-left:auto;margin-right:auto}
#rest{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:var(--soft);margin-bottom:8px;font-variant-numeric:tabular-nums;text-align:left}
#rest i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width 1s linear}
#rest.over{background:#d9f5df;color:#0d4a1c}
#rest small{color:inherit;opacity:.75}
#action{display:flex;width:100%;min-height:66px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-bottom:6px;padding:6px 12px}
#action .a2{font-size:15px;font-weight:600;opacity:.9}
nav{display:flex}
nav button{flex:1;min-height:52px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);gap:2px}
nav button span{font-size:20px}
nav button[aria-current=page]{color:var(--accent);font-weight:700}

/* Bottom sheet & toast */
#sheet{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pe{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.pe .ins{display:flex;gap:6px;align-items:center}
.pe input{width:64px;padding:8px;text-align:center}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw}
</style>
</head>
<body data-theme="blue">
<header id="hdr"></header>
<main id="view"></main>
<div id="bottom">
  <button id="rest" data-act="skipRest" hidden></button>
  <button id="action" hidden></button>
  <nav id="nav"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
'use strict';

   start: starting weight (kg; per hand if perHand) · step: +/− increment
   items: { ex, sets, reps:[min,max] }  (for time: seconds/minutes)
   schedule: index = day of week (0 = Sunday … 6 = Saturday), null = rest
   ===================================================================== */
const DEFAULT_PLAN = {

    { name:{ en:'Incline walk', vi:'Đi bộ dốc' }, min:'5–10', setting:'Incline 6 · Speed 5–5.5' },

             vi:'Bước ngắn, đều. Tiếp đất nhẹ bằng gót rồi chuyển qua giữa bàn chân và mũi chân. Không cần bám tay vịn.' },

    ['08:00','08:07',{ en:'Warm-up', vi:'Khởi động' }], ['08:07','08:42',{ en:'Weights', vi:'Tập tạ' }],

  ],
  tips: [
    { en:"Don't train to failure — keep 2–3 reps in reserve.", vi:'Không tập đến failure — giữ 2–3 reps dự phòng.' },
    { en:'Increase weight only after completing all reps with good form.', vi:'Chỉ tăng tạ khi đã hoàn thành đủ reps với kỹ thuật chuẩn.' }
  ],
  weeks: [
    { en:'Get used to the schedule, pick comfortable weights.', vi:'Làm quen lịch, chọn mức tạ thoải mái.' },
    { en:'Keep weights, watch fatigue and recovery.', vi:'Giữ mức tạ, theo dõi độ mỏi và hồi phục.' },
    { en:'Increase weight slightly if strong enough and form is good.', vi:'Tăng nhẹ tạ nếu đủ sức và đúng kỹ thuật.' },
    { en:'Assess strength, glute measurements, thigh feel, energy.', vi:'Đánh giá sức mạnh, vòng mông, cảm giác đùi và năng lượng.' }
  ]
};

/* ===== 2. TEXT (English / Vietnamese) ===== */

const DAYS = { en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], vi:['CN','T2','T3','T4','T5','T6','T7'] };

/* ===== 3. STORAGE (versioned, saved on every tap) ===== */
const KEY = 'gymlog';
const DEFAULT_STATE = () => ({
  version: 1,
  weights: {},          // exerciseId -> last used weight (kg)
  history: [],          // finished sessions, newest first
  current: null,        // in-progress session (resumed if reopened the same day)
  assessments: [],      // week-4 check-ins
  plan: null,           // custom plan (null = DEFAULT_PLAN)
  settings: { lang:'en', theme:'blue', rest:90, sound:true, startDate:null }
});
function migrate(d) {
  const base = DEFAULT_STATE();
  if (!d || typeof d !== 'object') return base;
  // Future versions: transform older data here, e.g. if (d.version === 1) { ...; d.version = 2 }
  return { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) }, version: 1 };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return DEFAULT_STATE();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast(t('saveFail')); }
}
let S = load();

/* In-memory UI state (not saved) */
const ui = { tab:'today', hseg:'sessions', progEx:null, expanded:new Set(), cues:new Set(),
  rest:null, restOver:0, pop:null, scrollTo:null, sheet:null, edit:null, noteI:null, histId:null,
  ci:{ glute:'', thigh:null, energy:null, notes:'' } };

/* ===== 4. HELPERS ===== */
const $ = s => document.querySelector(s);
const P = () => S.plan || DEFAULT_PLAN;
const t = k => (I18N[S.settings.lang] || I18N.en)[k] ?? I18N.en[k] ?? k;
const L = v => (v && typeof v === 'object') ? (v[S.settings.lang] ?? v.en) : (v ?? '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const num = n => String(Math.round(n * 100) / 100);
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const locale = () => S.settings.lang === 'vi' ? 'vi-VN' : 'en-GB';
const fmtDate = k => parseKey(k).toLocaleDateString(locale(), { weekday:'short', day:'numeric', month:'short' });
const fmtShort = k => parseKey(k).toLocaleDateString(locale(), { day:'numeric', month:'numeric' });
const mmss = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const fmtW = (w, x) => x.perHand ? `2 × ${num(w)} kg` : `${num(w)} kg`;
const doneCount = c => c.ex.reduce((a, x) => a + x.sets.filter(s => s.done).length, 0);
const totalCount = c => c.ex.reduce((a, x) => a + x.sets.length, 0);
const isTraining = sid => { const s = P().sessions[sid]; return !!s && !s.optional; };
const goalPerWeek = () => P().schedule.filter(s => s && isTraining(s)).length;
const unitTxt = x => x.kind === 'time' ? (x.unit === 'min' ? ' ' + t('minU') : ' s') : '';
function repsLabel(x) {
  const r = x.reps[0] === x.reps[1] ? x.reps[0] : `${x.reps[0]}–${x.reps[1]}`;
  return r + unitTxt(x) + (x.perSide ? ' ' + t('perSide') : '');
}
function setVal(x, s) {
  if (x.kind === 'weight') return `${fmtW(s.w, x)} × ${s.r}`;
  if (x.kind === 'time') return `${s.r}${unitTxt(x)}`;
  return `× ${s.r}`;
}
function elapsed(c) {
  if (!c || !c.start) return '⏱ 0:00';
  return '⏱ ' + mmss(Math.max(0, Math.floor((Date.now() - c.start) / 1000)));
}
function dur(h) { return h.start && h.end ? Math.max(1, Math.round((h.end - h.start) / 60000)) + ' ' + t('minU') : ''; }
function currentPos(c) {
  for (let i = 0; i < c.ex.length; i++) { const j = c.ex[i].sets.findIndex(s => !s.done); if (j >= 0) return { i, s: j }; }
  return null;
}
function programWeek() {
  if (!S.settings.startDate) return null;
  const days = Math.round((parseKey(dkey()) - parseKey(S.settings.startDate)) / 864e5);
  return Math.floor(days / 7) + 1;
}
function weekCounts() {
  const m = {};
  S.history.forEach(h => { if (isTraining(h.sid)) { const k = dkey(mondayOf(parseKey(h.date))); m[k] = (m[k] || 0) + 1; } });
  return m;
}
function calcStreak() {   // consecutive weeks hitting all training sessions (this week counts once complete)
  const goal = goalPerWeek(); if (!goal) return 0;
  const m = weekCounts(); const d = mondayOf(new Date()); let n = 0;
  if ((m[dkey(d)] || 0) >= goal) n++;
  for (;;) { d.setDate(d.getDate() - 7); if ((m[dkey(d)] || 0) >= goal) n++; else break; }
  return n;
}
function lastPerf(exId) {   // most recent finished performance of an exercise
  for (const h of S.history) { const e = h.ex.find(e => e.ex === exId && e.sets.some(s => s.done)); if (e) return e; }
  return null;
}
function readyToIncrease(x) {
  const e = lastPerf(x.ex); if (!e || e.effort === 'hard') return false;
  const allDone = e.sets.every(s => s.done);
  const allTop = allDone && e.sets.every(s => s.r >= e.reps[1]);
  if (!(allTop || (allDone && e.effort === 'easy'))) return false;
  const curW = (x.sets.find(s => !s.done) || x.sets[x.sets.length - 1]).w;
  return Math.min(...e.sets.map(s => s.w ?? 0)) >= curW;   // hide once you've already gone up
}
function newSession(sid) {
  const p = P(), ses = p.sessions[sid];
  return {
    id: Date.now().toString(36), date: dkey(), sid, name: ses.name, start: null, end: null, lastTs: null, note: '',
    tm: ses.treadmill ? p.treadmill.map(() => false) : [],
    ex: ses.items.map(it => {
      const e = p.exercises[it.ex] || { name: it.ex, kind: 'bw' };
      const w = e.kind === 'weight' ? (S.weights[it.ex] ?? e.start ?? 0) : null;
      return { ex: it.ex, name: e.name, kind: e.kind, perHand: !!e.perHand, perSide: !!e.perSide, unit: e.unit || null,
        step: e.step || 2.5, reps: [...it.reps], effort: null, note: '',
        sets: Array.from({ length: it.sets }, () => ({ w, r: it.reps[0], done: false })) };
    })
  };
}
function archiveCurrent() {   // move in-progress session into history (if anything was logged)
  const c = S.current; if (!c) return;
  if (doneCount(c) > 0 || c.tm.some(Boolean)) { c.end = c.end || c.lastTs || Date.now(); c.start = c.start || c.end; S.history.unshift(c); }
  S.current = null;
}
function settleStale() { if (S.current && S.current.date !== dkey()) { archiveCurrent(); save(); } }
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

/* ===== 5. RENDER: TODAY ===== */
function renderToday() {
  settleStale();
  if (!S.current) {
    const doneToday = S.history.find(h => h.date === dkey());
    const sid = P().schedule[new Date().getDay()];
    if (doneToday) return weekCard() + doneCard(doneToday);
    if (!sid || !P().sessions[sid]) return weekCard() + restCard();
    S.current = newSession(sid); save();
  }
  const c = S.current, cur = currentPos(c);
  return weekCard() + c.ex.map((x, i) => exCard(x, i, cur)).join('') + treadmillCard(c) + finishCard(c) + tipsCard();
}
function weekCard() {
  const w = programWeek(); let main;
  if (w === null) main = `<b>${t('setStart')}</b><button class="btn inline" data-act="startProgram">${t('startThisWeek')}</button>`;
  else if (w < 1) main = `<span>${t('startsOn')} <b>${fmtDate(S.settings.startDate)}</b></span>`;
  else if (w > 4) main = `<span>${t('programDone')}</span>`;
  else main = `<span><b>${t('week')} ${w}/4</b> · ${esc(L(P().weeks[w - 1]))}</span>` +
    (w === 4 ? `<button class="btn inline" data-act="goCheckin">${t('checkinCta')} →</button>` : '');
  const m = weekCounts();
  return `<section class="card week">${main}<div class="stats"><span>${t('thisWeek')} <b>${m[dkey(mondayOf(new Date()))] || 0}/${goalPerWeek()}</b></span>` +
    `<span>🔥 ${t('streak')} <b>${calcStreak()}</b> ${t('weeksUnit')}</span></div></section>`;
}
function sessionButtons() {
  const p = P();
  return `<div class="stack">` + Object.entries(p.sessions).map(([sid, s]) => {
    const days = p.schedule.map((v, d) => v === sid ? DAYS[S.settings.lang][d] : null).filter(Boolean).join(', ');
    return `<button class="btn" data-act="pickSession" data-sid="${sid}">${esc(L(s.name))}${days ? ` <small class="muted">· ${days}</small>` : ''}</button>`;
  }).join('') + `</div>`;
}
function restCard() {
  return `<section class="card center"><div class="emoji">💤</div><h2>${t('restDay')}</h2><p class="muted">${t('restDayMsg')}</p>${sessionButtons()}</section>`;
}
function doneCard(h) {
  return `<section class="card center"><div class="emoji">🎉</div><h2>${t('doneToday')}</h2>
    <p class="muted">${esc(L(h.name))} · ${doneCount(h)}/${totalCount(h)} ${t('sets')}${dur(h) ? ' · ' + dur(h) : ''}</p></section>
    <section class="card"><h3>${t('another')}</h3>${sessionButtons()}</section>`;
}
function exCard(x, i, cur) {
  const done = x.sets.every(s => s.done), isCur = cur && cur.i === i;
  const open = !done || ui.expanded.has(i);

  if (!open) return h + '</section>';
  if (x.kind === 'weight') {
    if (readyToIncrease(x)) h += `<span class="badge">↑ ${t('ready')}</span>`;
    const mainW = (x.sets.find(s => !s.done) || x.sets[x.sets.length - 1]).w;
    h += `<div class="wrow"><button class="round" data-act="wstep" data-i="${i}" data-d="-1" aria-label="Decrease weight">−</button>

    `<button class="chip${x.effort === v ? ' on' : ''}" data-act="effort" data-i="${i}" data-v="${v}">${t(v)}</button>`).join('') +

function treadmillCard(c) {

/* ===== 6. RENDER: HISTORY / PROGRESS / CHECK-IN ===== */
function seg(keys, cur, act) {
  return `<div class="seg">${keys.map(k => `<button class="${k === cur ? 'on' : ''}" data-act="${act}" data-v="${k}">${t(k)}</button>`).join('')}</div>`;
}
function renderHistory() {
  let h = seg(['sessions', 'progress', 'checkin'], ui.hseg, 'hseg');
  if (ui.hseg === 'sessions') {
    if (!S.history.length) return h + `<section class="card center muted">${t('noHistory')}</section>`;
    return h + S.history.map(x => `<button class="card hist" data-act="histOpen" data-id="${x.id}">
      <div><b>${fmtDate(x.date)}</b><br>${esc(L(x.name))}</div>
      <span>${doneCount(x)}/${totalCount(x)} ${t('sets')}${dur(x) ? '<br>' + dur(x) : ''}</span></button>`).join('');
  }
  if (ui.hseg === 'progress') return h + progressView();
  return h + checkinView();
}
function series(exId) {
  return S.history.slice().reverse().map(h => {
    const e = h.ex.find(e => e.ex === exId); const ds = e ? e.sets.filter(s => s.done && s.w != null) : [];
    return ds.length ? { d: h.date, w: Math.max(...ds.map(s => s.w)), r: ds.reduce((a, s) => a + s.r, 0), perHand: e.perHand } : null;
  }).filter(Boolean);
}
function progressView() {
  const ids = Object.entries(P().exercises).filter(([, e]) => e.kind === 'weight').map(([id]) => id);
  if (!ui.progEx || !ids.includes(ui.progEx)) ui.progEx = ids.find(id => series(id).length) || ids[0];
  let h = `<div class="chips">${ids.map(id => `<button class="chip${id === ui.progEx ? ' on' : ''}" data-act="progEx" data-ex="${id}">${esc(L(P().exercises[id].name))}</button>`).join('')}</div>`;
  const pts = series(ui.progEx), ex = P().exercises[ui.progEx];
  h += `<section class="card"><h3>${esc(L(ex.name))} — ${t('topWeight')} (kg${ex.perHand ? ', ' + t('perHand') : ''})</h3>`;
  if (!pts.length) return h + `<p class="muted">${t('noData')}</p></section>`;
  const diff = pts[pts.length - 1].w - pts[0].w;
  h += `<p class="muted small">${t('change')}: <b style="color:var(--ink)">${diff >= 0 ? '+' : ''}${num(diff)} kg</b></p>` + chartSVG(pts);
  h += `<table><thead><tr><th>${t('date')}</th><th>${t('topWeight')}</th><th>${t('totalReps')}</th></tr></thead><tbody>` +
    pts.slice().reverse().slice(0, 12).map(p => `<tr><td>${fmtDate(p.d)}</td><td>${num(p.w)} kg</td><td>${p.r}</td></tr>`).join('') + `</tbody></table>`;
  return h + '</section>';
}
function chartSVG(pts) {   // single-series line chart, tap/drag for values
  const W = 340, H = 170, Lp = 36, R = 14, T = 14, B = 24;
  let lo = Math.min(...pts.map(p => p.w)), hi = Math.max(...pts.map(p => p.w));
  if (hi - lo < 2) { lo -= 2.5; hi += 2.5; }
  const pv = (hi - lo) * 0.12; lo = Math.max(0, lo - pv); hi += pv;
  const x = i => pts.length === 1 ? (Lp + W - R) / 2 : Lp + i * (W - Lp - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  [0, 0.5, 1].forEach(f => { const v = lo + (hi - lo) * f, yy = y(v).toFixed(1);
    g += `<line class="grid" x1="${Lp}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${Lp - 6}" y="${+yy + 4}" text-anchor="end">${num(Math.round(v * 2) / 2)}</text>`; });
  g += `<text class="ax" x="${x(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtShort(pts[0].d)}</text>`;
  if (pts.length > 1) g += `<text class="ax" x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length - 1].d)}</text>`;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  const dots = pts.map((p, i) => `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="5"/>`).join('');
  const data = esc(JSON.stringify(pts.map((p, i) => [+x(i).toFixed(1), +y(p.w).toFixed(1), p.d, p.w])));

}

  const svg = ch.querySelector('svg'), r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * 340 / r.width;
  const pts = JSON.parse(ch.dataset.pts);
  const b = pts.reduce((a, p) => Math.abs(p[0] - sx) < Math.abs(a[0] - sx) ? p : a);
  const xh = ch.querySelector('.xh'); xh.setAttribute('x1', b[0]); xh.setAttribute('x2', b[0]); xh.style.display = '';
  const tip = ch.querySelector('.tip'); tip.hidden = false; tip.textContent = `${fmtDate(b[2])} · ${num(b[3])} kg`;

}

/* ===== 9. MAIN RENDER ===== */

  renderHeader(); renderAction(); renderNav(); tickRest();

}
function renderHeader() {
  const h = $('#hdr'), c = S.current;

    const d = doneCount(c), n = totalCount(c);
    h.innerHTML = `<div class="hrow"><button class="ses" data-act="switch">${esc(L(c.name))} <span>▾</span></button><span id="clock" class="clock">${elapsed(c)}</span></div>

}

function updateBottomPad() { document.documentElement.style.setProperty('--bottom-h', $('#bottom').offsetHeight + 'px'); }

/* ===== 10. REST TIMER, SOUND, WAKE LOCK ===== */
function startRest() { ui.rest = { end: Date.now() + S.settings.rest * 1000, total: S.settings.rest }; ui.restOver = 0; }
function tickRest() {
  const el = $('#rest');
  if (ui.rest) {
    const left = Math.ceil((ui.rest.end - Date.now()) / 1000);
    if (left > 0) {
      el.hidden = false; el.className = '';
      el.innerHTML = `<span>⏱ ${t('rest')} <b>${mmss(left)}</b></span><small>${t('tapSkip')}</small><i style="width:${100 * left / ui.rest.total}%"></i>`;
      return updateBottomPad();
    }
    ui.rest = null; ui.restOver = Date.now(); if (S.settings.sound) beep();
  }
  if (ui.restOver && Date.now() - ui.restOver < 5000) { el.hidden = false; el.className = 'over'; el.innerHTML = `<span>✅ ${t('restOver')}</span>`; }
  else { el.hidden = true; ui.restOver = 0; }
  updateBottomPad();
}
let actx = null;
function unlockAudio() {   // iOS only allows audio after a user tap; note the silent switch mutes it
  try { if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
        if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep() {
  if (!actx) return;
  const t0 = actx.currentTime;
  [0, 0.28, 0.56].forEach(o => {
    const os = actx.createOscillator(), g = actx.createGain();
    os.frequency.value = 880; g.gain.setValueAtTime(0.0001, t0 + o);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + o + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + o + 0.2);
    os.connect(g); g.connect(actx.destination); os.start(t0 + o); os.stop(t0 + o + 0.22);
  });
}
let wakeLock = null;
async function wake() {   // keep the screen on during a session (if the browser supports it)
  if (!('wakeLock' in navigator) || wakeLock || document.hidden || !S.current) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {}
}
function releaseWake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }

/* ===== 11. ACTIONS (all taps go through here) ===== */
const ACT = {
  tab(d) { ui.tab = d.v; ui.sheet = null; drawSheet(); window.scrollTo(0, 0); render(); },
  toggleSet(d) {
    const c = S.current, i = +d.i, j = +d.s, x = c.ex[i], s = x.sets[j];
    s.done = !s.done; c.lastTs = Date.now(); ui.pop = `s${i}-${j}`;
    if (s.done) {
      c.start = c.start || Date.now();
      if (x.kind === 'weight') S.weights[x.ex] = s.w;          // remember weight for next time
      if (currentPos(c)) startRest(); else ui.rest = null;
      if (x.sets.every(z => z.done)) {                          // exercise finished → move to the next one
        ui.expanded.delete(i);
        const nxt = currentPos(c);
        ui.scrollTo = nxt ? `ex${nxt.i}` : (c.tm.length ? 'tm' : 'fin'); ui.pop = null;
      }
    }
    save(); render();
  },
  toggleEx(d) { const i = +d.i; ui.expanded.has(i) ? ui.expanded.delete(i) : ui.expanded.add(i); render(); },
  wstep(d) {
    const x = S.current.ex[+d.i], open = x.sets.filter(s => !s.done);
    const base = (open[0] || x.sets[x.sets.length - 1]).w;
    const nw = Math.max(0, Math.round((base + (+d.d) * x.step) * 100) / 100);
    (open.length ? open.filter(s => !s.custom) : x.sets).forEach(s => { s.w = nw; });
    if (open[0] && open[0].custom) open[0].w = nw;
    S.weights[x.ex] = nw; save(); render();
  },
  editSet(d) { ui.edit = { i: +d.i, s: +d.s }; openSheet('edit'); },
  ew(d) {
    const x = S.current.ex[ui.edit.i], st = x.sets[ui.edit.s];
    st.w = Math.max(0, Math.round((st.w + (+d.d) * x.step) * 100) / 100); st.custom = true;
    S.weights[x.ex] = st.w; save(); render();
  },
  er(d) {
    const x = S.current.ex[ui.edit.i], st = x.sets[ui.edit.s];
    st.r = Math.max(0, st.r + (+d.d) * (x.kind === 'time' && x.unit !== 'min' ? 5 : 1)); st.custom = true; save(); render();
  },
  effort(d) { const x = S.current.ex[+d.i]; x.effort = x.effort === d.v ? null : d.v; save(); render(); },
  exNote(d) { ui.noteI = +d.i; openSheet('note'); setTimeout(() => { const ta = $('#sheet textarea'); if (ta) ta.focus(); }, 250); },
  tm(d) { const c = S.current; c.tm[+d.k] = !c.tm[+d.k]; c.lastTs = Date.now(); c.start = c.start || Date.now();
    ui.pop = null; if (c.tm.every(Boolean)) ui.scrollTo = 'fin'; save(); render(); },
  finish() {
    const c = S.current; if (!c) return;
    if (!doneCount(c) && !c.tm.some(Boolean)) { if (!confirm(t('nothingLogged'))) return; S.current = null; }
    else { c.end = Date.now(); archiveCurrent(); toast(t('saved')); }
    ui.rest = null; ui.restOver = 0; ui.expanded.clear(); releaseWake(); save(); window.scrollTo(0, 0); render();
  },
  switch() { openSheet('switch'); },
  pickSession(d) {
    const c = S.current;
    if (c && c.sid === d.sid) { ui.sheet = null; drawSheet(); return; }
    if (c && (doneCount(c) || c.tm.some(Boolean))) { if (!confirm(t('switchConfirm'))) return; archiveCurrent(); }
    S.current = newSession(d.sid); ui.expanded.clear(); ui.rest = null; ui.sheet = null; drawSheet();
    ui.tab = 'today'; save(); window.scrollTo(0, 0); render();
  },
  closeSheet() { ui.sheet = null; drawSheet(); },
  skipRest() { ui.rest = null; ui.restOver = 0; tickRest(); },
  startProgram() { S.settings.startDate = dkey(mondayOf(new Date())); save(); render(); },
  clearStart() { S.settings.startDate = null; save(); render(); },
  goCheckin() { ui.tab = 'history'; ui.hseg = 'checkin'; window.scrollTo(0, 0); render(); },
  hseg(d) { ui.hseg = d.v; render(); },
  progEx(d) { ui.progEx = d.ex; render(); },
  histOpen(d) { ui.histId = d.id; openSheet('hist'); },
  histDel() { if (!confirm(t('confirmDelete'))) return; S.history = S.history.filter(h => h.id !== ui.histId); ui.sheet = null; drawSheet(); save(); render(); },
  ci(d) { ui.ci[d.k] = d.k === 'energy' ? +d.v : d.v; render(); },
  ciSave() {
    const c = ui.ci; if (!c.glute && !c.thigh && !c.energy && !c.notes) return;
    S.assessments.unshift({ date: dkey(), week: programWeek(), glute: c.glute, thigh: c.thigh, energy: c.energy, notes: c.notes });
    ui.ci = { glute:'', thigh:null, energy:null, notes:'' }; save(); toast(t('checkinSaved')); render();
  },
  set(d) { S.settings[d.k] = d.v === 'true' ? true : d.v === 'false' ? false : d.v; save(); render(); makeIcon(); },
  restStep(d) { S.settings.rest = Math.min(600, Math.max(15, S.settings.rest + (+d.d) * 15)); save(); render(); },
  planOpen() { openSheet('plan'); },
  planJson() {
    try {
      const p = JSON.parse($('#planJson').value);
      if (!p.exercises || !p.sessions || !Array.isArray(p.schedule) || p.schedule.length !== 7 || !Array.isArray(p.treadmill)) throw 0;
      for (const s of Object.values(p.sessions)) for (const it of s.items) if (!p.exercises[it.ex] || !(it.sets > 0) || it.reps.length !== 2) throw 0;
      S.plan = { ...DEFAULT_PLAN, ...p }; save(); toast(t('planSaved')); render();
    } catch (e) { toast(t('planBad')); }
  },
  planReset() { if (!confirm(t('restoreDefault') + '?')) return; S.plan = null; save(); toast(t('planSaved')); render(); },
  exportData() {
    const name = `gym-log-backup-${dkey()}.json`;
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
    const file = typeof File === 'function' ? new File([blob], name, { type:'application/json' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
      navigator.share({ files:[file], title:name }).catch(() => {});   // iPhone: Save to Files / AirDrop / Mail
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast(t('exported'));
    }
  },
  importData() { $('#file').click(); },
  resetAll() { if (!confirm(t('resetConfirm'))) return; releaseWake(); S = DEFAULT_STATE(); save(); ui.tab = 'today'; toast(t('resetDone')); render(); makeIcon(); }
};
function importFile(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d.version !== 'number' || !Array.isArray(d.history)) throw 0;
      if (!confirm(t('importConfirm'))) return;
      S = migrate(d); save(); toast(t('importOk')); render(); makeIcon();
    } catch (e) { toast(t('importBad')); }
    input.value = '';
  };
  r.readAsText(f);
}

/* ===== 12. EVENTS ===== */
document.addEventListener('pointerdown', unlockAudio, { passive:true });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el.dataset, el); wake();
});

  const el = e.target, k = el.dataset.input; if (!k) return;
  if (k === 'snote' && S.current) { S.current.note = el.value; save(); }
  else if (k === 'xnote' && S.current) { S.current.ex[ui.noteI].note = el.value; save(); }
  else if (k.startsWith('ci-')) ui.ci[k.slice(3)] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'file') return importFile(el);
  if (el.dataset.change === 'startDate') { S.settings.startDate = el.value || null; save(); render(); }
  if (el.dataset.change === 'plan') {
    const v = Number(el.value); if (!(v >= 0) || el.value === '') return toast(t('planBad'));
    if (!S.plan) S.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
    const path = el.dataset.path.split('.'); let o = S.plan;
    path.slice(0, -1).forEach(k => { o = o[k]; }); o[path[path.length - 1]] = v;
    save(); toast(t('planSaved'));
  }
});
document.addEventListener('toggle', e => {   // remember which cues/tips are open across re-renders
  const k = e.target.dataset && e.target.dataset.cue; if (k === undefined) return;
  const key = isNaN(+k) ? k : +k; e.target.open ? ui.cues.add(key) : ui.cues.delete(key);
}, true);
document.addEventListener('pointerdown', chartPointer);
document.addEventListener('pointermove', chartPointer);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); wake(); } });
window.addEventListener('resize', updateBottomPad);

/* ===== 13. APP ICON (drawn at runtime so the file stays single & offline) ===== */
function makeIcon() {
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 180; const g = cv.getContext('2d');
    const pink = S.settings.theme === 'pink';
    const gr = g.createLinearGradient(0, 0, 180, 180);
    gr.addColorStop(0, pink ? '#ffc2db' : '#bcdcff'); gr.addColorStop(1, pink ? '#e2558f' : '#3f7fe0');
    g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
    g.fillStyle = '#fff';
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.fill(); };
    rr(40, 84, 100, 12, 6); rr(30, 58, 18, 64, 7); rr(132, 58, 18, 64, 7); rr(16, 70, 14, 40, 6); rr(150, 70, 14, 40, 6);
    const url = cv.toDataURL('image/png');
    $('#touchIcon').href = url; $('#favIcon').href = url;
  } catch (e) {}
}

/* ===== START ===== */
settleStale();
render();
makeIcon();
setInterval(() => {
  const c = $('#clock'); if (c && S.current) c.textContent = elapsed(S.current);
  tickRest();
}, 1000);
</script>
